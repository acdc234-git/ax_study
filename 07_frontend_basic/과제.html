<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재직자용 실무 실습 캠프 | 90% 이상 국비 지원</title>
    <link rel="stylesheet" href="과제_style.css">
</head>
<body>

    <div class="chatbutton">
        <div class="chat">
            <img src="qq.png" width="150px">
        </div>
        <div class="button">
            <img src="q.png" width="70px">
        </div>
    </div>
    <div class="header">
        <!-- <a href="#" class="logo">PRO CAMP</a> -->
        <img src="procamp.svg" width="200px">
        
        <div class="track">
            <a href="#">데이터 트랙
                <span class="arrow">
                    <svg width="14" height="8" viewBox="0 0 14 8">
                        <polyline points="1,1 7,7 13,1" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"></polyline>
                    </svg>
                </span>
            </a>                
            <a href="#">개발 트랙
                <span class="arrow">
                    <svg width="14" height="8" viewBox="0 0 14 8">
                        <polyline points="1,1 7,7 13,1" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"></polyline>
                    </svg>
                </span>
            </a>
        </div>
    </div>
    <div class="center">
        <div class="box">
            <img src="sparataclub.png" width="200"><br>
            <!--<span class="sparta">SPARTA</span>
            <span class="club">Club</span> -->
            <img src="procamp.svg" width="500px">
        </div>
        <p class="headline">
            아는 것을 넘어,
            <span class="purple">할 수 있게 만드는</span><br>
            재직자 실무 훈련 캠프
        </p>
        <p class="desc">
            진짜 프로는 단순히 아는 것을 넘어 직접 할 줄 아는 사람입니다. 실무 훈련 프로젝트로, 내 일을 주도하는 전문가로 거듭나세요.
        </p>

        <div class="comming">
            <p class="soon">곧 오픈</p>
            <p class="peek">사전 신청 트랙</p>
        </div>
    </div>
</body>
</html>
