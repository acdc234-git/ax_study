<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        *{
            box-sizing: : border-box;
        }
        body{
            margin: 0;
        }
        ul{
            list-style: none;
            margin: 0;
            padding: 0;
            border: 1px solid #000;
            height: 100px;
        }

        li{
            flex-basis: 200px;
            flex-shrink: 0;
        }

        li:nth-of-type(1){
            background: red;
        }

        li:nth-of-type(2){
            background: blue;
        }

        li:nth-of-type(3){
            background: green;
        }
        .flex1{
            display: flex;
        }

        .flex2{
            display: flex;
            align-items: flex-start;
        }

        .flex3{
            display: flex;
            align-items: flex-end;
        }

        .flex4{
            display: flex;
            align-items: center;
        }
        <!--
        .flex5{
            display: flex;
            justify-content: center;
        }
    
        .flex6{
            display: flex;
            justify-content: space-between;
        }

        .flex7{
            display: flex;
            justify-content: space-around;
        }

        .flex8{
            display: flex;
            justify-content: space-evenly;
        } -->
    </style>
    <h3>align-items: stretch(기본값)</h3>
    <ul class="flex1">
        <li>메뉴1</li>
        <li>메뉴2</li>
        <li>메뉴3</li>
        <li>메뉴4</li>
        <li>메뉴5</li>
        <li>메뉴6</li>
        <li>메뉴7</li>
        <li>메뉴8</li>
        <li>메뉴9</li>
    </ul>


</body>
</html>
